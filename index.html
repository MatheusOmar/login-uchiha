<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clã Uchiha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="form-container">
      <header class="cabecalho">
        <div class="sharingan" aria-hidden="true"></div>
        <h1>Clã Uchiha</h1>
        <p>Desperte seu Sharingan</p>
      </header>

      <section class="form-section">
        <form action="#" method="POST">
          <fieldset>
            <legend>Cadastro Uchiha</legend>

            <div class="grupo-form">
              <label for="nome">Nome</label>
              <input
                id="nome"
                name="nome"
                type="text"
                placeholder="Sasuke"
                required
              />
            </div>

            <div class="grupo-form">
              <label for="email">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="sasuke@uchiha.com"
                required
              />
            </div>
          </fieldset>

          <button type="submit" class="btn">Ativar Sharingan</button>
        </form>
      </section>
    </main>
  </body>
</html>
